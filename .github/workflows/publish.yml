name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.0
        with:
          version: "2026.9.18"
          install_args: "node jq"
          cache: false
      - name: Check the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm publish
