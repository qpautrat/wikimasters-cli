lefthook: mise exec -- lefthook

pre-commit:
  jobs:
    - name: refuse .env
      glob:
        - ".env"
        - "**/.env"
      run: echo ".env holds the WikiMasters refresh token and must never be committed" >&2; exit 1
    - name: refuse captures
      files: git diff --cached --name-only --diff-filter=d
      glob:
        - "*.har"
        - "**/*.har"
      run: echo "HAR captures hold account data and stay local" >&2; exit 1
    - name: scan staged changes for secrets
      run: betterleaks git --staged --no-banner .
    - name: audit production dependencies
      glob:
        - "package.json"
        - "package-lock.json"
      run: scripts/audit-staged.sh
    - name: verify staged content
      exclude:
        - "specs/**"
        - "docs/**"
        - "*.md"
      run: scripts/verify-staged.sh
